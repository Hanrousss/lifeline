<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Lifeline — люди</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eee8dd;color:#332d27;font:16px system-ui}main{max-width:1400px;margin:auto;padding:24px}h1{font-size:24px;margin:0 0 8px}.intro{margin:0 0 20px;color:#675e53}.layout{display:grid;grid-template-columns:minmax(300px,1fr) 330px;gap:20px}.views{display:grid;grid-template-columns:1fr 1fr;gap:14px}.view{background:#fffaf2;border-radius:16px;overflow:hidden}.view h2{font-size:15px;margin:14px}canvas{display:block;width:100%;height:auto}.figure{background:repeating-conic-gradient(#f1ede6 0 25%,#fffaf3 0 50%) 0/22px 22px}.panel{background:#fffaf2;border-radius:16px;padding:18px;display:grid;align-content:start;gap:12px}label{display:grid;gap:5px}select,input,button{font:inherit;border:1px solid #c8bca9;border-radius:8px;background:white;padding:8px;max-width:100%}button{cursor:pointer;background:#e5edda}fieldset{border:1px solid #d6ccbe;border-radius:10px;display:grid;gap:12px}#status{font-size:14px;min-height:40px}details{grid-column:1/-1}.layer-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.layer-grid img{width:100%;background:#f9f5ed;border:1px solid #d5cbbc;border-radius:8px}.layer-grid figure{margin:0}.layer-grid figcaption{font-size:12px;overflow-wrap:anywhere}@media(max-width:1000px){.layout{grid-template-columns:1fr}.panel{grid-template-columns:1fr 1fr}.views{grid-template-columns:1fr 1fr}#status,fieldset{grid-column:1/-1}}@media(max-width:600px){main{padding:12px}.views{grid-template-columns:1fr}.layer-grid{grid-template-columns:repeat(3,1fr)}}
</style>
<main><h1>Люди Lifeline · рабочая сборка</h1><p class="intro">Отдельные PNG-слои, разные возраста и внешность. Статичные позы. Это редактор графики, интерфейс игры здесь не меняется.</p>
<div class="layout"><div class="views"><section class="view"><h2>Персонаж отдельно</h2><canvas id="figure" class="figure" width="768" height="768"></canvas></section><section class="view"><h2 id="room-heading">Масштаб в комнате</h2><canvas id="room" width="960" height="960"></canvas></section><details><summary>Показать отдельные слои</summary><div id="layers" class="layer-grid"></div></details></div>
<aside class="panel"><label>Возрастная группа<select id="age"></select></label><label>Возраст внутри группы, месяцы<input id="months" type="number" min="0" step="1" value="360"></label><label>Пол<select id="sex"><option value="female">Женский</option><option value="male">Мужской</option></select></label><label>Основа внешности<select id="base"></select></label><button id="variation">Другой вариант этой основы</button><label>Форма лица<select id="face"></select></label><label>Кожа<select id="skin"></select></label><label>Причёска<select id="hair"></select></label><label>Цвет волос<select id="hairColor"></select></label><label>Фасон одежды<select id="outfit"><option value="0">Повседневный</option><option value="1">Лёгкий</option><option value="2">Для сна</option></select></label><label>Цвет верха<select id="top"></select></label><label>Цвет низа<select id="bottom"></select></label><label>Цвет обуви<select id="shoes"></select></label><label>Поза<select id="pose"></select></label><fieldset><legend>Состояние</legend><label>Счастье<input id="happiness" type="range" min="0" max="100" value="100"></label><label>Силы<input id="energy" type="range" min="0" max="100" value="100"></label></fieldset><button id="apply" hidden>Применить внешность в игре</button><button id="png">Скачать PNG персонажа</button><button id="save">Скачать сочетание признаков</button><p id="status" role="status">Загружаю слои…</p></aside></div></main>
<script src="runtime/humans.js?v=12"></script><script src="runtime/editor.js?v=12"></script></html>
