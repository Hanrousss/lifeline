<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../"><title>Lifeline — проверка подключения PNG</title><link rel="stylesheet" href="style.css?v=0.14.0"><style>
body{display:block!important;padding:24px;background:#f2efe6;color:#354739;font:14px system-ui;overflow:auto!important;height:auto!important}main{max-width:480px;margin:auto}h1{font:28px Georgia;line-height:1.2}p{line-height:1.5}a{color:#395e49}select,button{font:inherit;padding:8px;margin:6px 8px 10px 0}.live-scene-frame{width:100%;aspect-ratio:1;position:relative;border-radius:16px;overflow:hidden;background:#e5d6b7}.legacy-scene{display:grid;place-items:center}canvas{touch-action:manipulation}
</style></head><body><main><p><a href="./">← Игра</a> · <a id="editor" href="art/index.html?life=0">Редактор внешности</a></p><h1>Домашняя PNG-сцена</h1><p>Проверка того же модуля, который рисует комнату в игре. Игровая жизнь не запускается. Профиль выбирается по возрасту и полу.</p><label>Персонаж <select id="profile"><option value="adult_f">Женщина · 26 лет</option><option value="adult_m">Мужчина · 26 лет</option><option value="elder_f">Пожилая женщина · 70 лет</option><option value="child">Ребёнок · 8 лет</option></select></label><div class="live-scene-frame" id="fixture"></div><p>Нажмите на свободный пол, чтобы переставить персонажа. Для этой проверки используется отдельная внешность № 0.</p><button id="download">PNG сцены</button></main><script src="art/runtime/core.js?v=11"></script><script src="art/runtime/renderer.js?v=10"></script><script src="modular-scene.js?v=6"></script><script>
'use strict';let fixtureState;function draw(){const id=document.querySelector('#profile').value;fixtureState={seed:0,age:id==='child'?8:id==='elder_f'?70:26,origin:{sex:id==='adult_m'?'male':'female'}};document.querySelector('#fixture').innerHTML='<div class="legacy-scene">Загружаем комнату…</div>'+LifelineGameArt.markup(fixtureState,'home');document.querySelector('#editor').href=LifelineGameArt.editorUrl(fixtureState);LifelineGameArt.mount(document,fixtureState,'home');}document.querySelector('#profile').onchange=draw;window.addEventListener('focus',draw);window.addEventListener('storage',e=>{if(e.key===LifelineGameArt.storageKey(fixtureState))draw();});document.querySelector('#download').onclick=()=>{const c=document.querySelector('canvas');if(c.style.visibility!=='visible')return;c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='lifeline-game-integration.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);});};draw();
</script></body></html>
